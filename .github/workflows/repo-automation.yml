name: Repo Automation

on:
  issues:
    types: [opened, edited, reopened]
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  issues: write
  pull-requests: write
  contents: read

jobs:
  auto-label:
    runs-on: ubuntu-latest
    steps:
      - name: Label issues by keyword
        if: github.event_name == 'issues'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.ARKAIOS_WORLD_REPO_TOKEN }}
          script: |
            const body = (context.payload.issue.title + ' ' + context.payload.issue.body).toLowerCase();
            const labels = [];

            if (body.includes('bug') || body.includes('error') || body.includes('fix')) labels.push('bug');
            if (body.includes('feature') || body.includes('feat')) labels.push('enhancement');
            if (body.includes('doc') || body.includes('readme')) labels.push('documentation');
            if (body.includes('protocol') || body.includes('schema') || body.includes('vocabulary')) labels.push('protocol-design');
            if (body.includes('security') || body.includes('trust') || body.includes('permission')) labels.push('safety-governance');

            if (labels.length > 0) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.issue.number,
                labels: labels
              });
            }

      - name: Label pull requests by size
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.ARKAIOS_WORLD_REPO_TOKEN }}
          script: |
            const pr = context.payload.pull_request;
            const changes = pr.additions + pr.deletions;
            let sizeLabel = 'size/S';
            if (changes > 500) sizeLabel = 'size/L';
            else if (changes > 100) sizeLabel = 'size/M';

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              labels: [sizeLabel, 'needs-review']
            });
