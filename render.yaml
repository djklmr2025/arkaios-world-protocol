services:
  - type: web
    name: arkaios-world
    runtime: python
    buildCommand: pip install -r world/requirements.txt
    startCommand: python world/server.py serve --state .local-world --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: ENVIRONMENT
        value: production
      - key: ALLOW_EXTERNAL
        value: "true"
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: GOOGLE_CLIENT_ID
        value: 502663599735-e4p66giu79jpjiofi570loibdimuiqtm.apps.googleusercontent.com
